name: Worker daily + weekly + video

# Digest éditorial (7h), récap hebdo (lundi 8h), vidéo d'article à la demande.
# Logs PUBLICS — aucun secret n'y est affiché (voir worker-live.yml).

on:
  # DESACTIVE (pas de secrets) — réactiver en remettant le bloc schedule.
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à exécuter (daily, weekly, ou video)"
        required: false
        default: "daily"
      articleId:
        description: "ID article (mode video uniquement)"
        required: false
        default: ""
  
