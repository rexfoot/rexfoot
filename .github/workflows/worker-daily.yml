name: Worker daily + weekly + video

# Digest éditorial (7h), récap hebdo (lundi 8h), vidéo d'article à la demande.
# Logs PUBLICS — aucun secret n'y est affiché (voir worker-live.yml).
# Déclenchement manuel uniquement pour l'instant (pas de secrets posés) :
# réactiver les crons "0 7 * * *" et "0 8 * * 1" quand les secrets seront en place.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode à exécuter (daily, weekly, ou video)"
        required: false
        default: "daily"
      articleId:
        description: "ID article (mode video uniquement)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Jobs planifiés / à la demande
        run: |
          if [ "${{ inputs.mode }}" = "video" ]; then npx tsx apps/worker/src/run-once.ts video "${{ inputs.articleId }}";
          else npx tsx apps/worker/src/run-once.ts "${{ inputs.mode }}"; fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SUPERVISOR_API_TOKEN: ${{ secrets.SUPERVISOR_API_TOKEN }}
